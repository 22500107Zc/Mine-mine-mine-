templates:
  auth_email_password_reset_subject:
    type: text/plain
    meta:
      short: Password reset subject
    template: "CulpOS: Reset your password"

  auth_email_password_reset_content:
    type: text/html
    meta:
      short: Password reset content
    template: |-
      {{template "email_general_header" .}}
        <h2 style="color:#0E1A2B;font-size:21px;margin:0 0 12px">Reset your password</h2>
        <p>Hello,</p>
        <p>Follow <a href="{{ .URL }}" style="color:#1F4E8C;">this link</a> and reset your password.</p>
        <p>You will be signed in to CulpOS after a successful reset. If you did not request this, you can ignore this email.</p>
      {{template "email_general_footer" .}}

  auth_email_confirm_subject:
    type: text/plain
    meta:
      short: Email confirmation subject
    template: "CulpOS: Confirm your email address"

  auth_email_confirm_content:
    type: text/html
    meta:
      short: Email confirmation content
    template: |-
      {{template "email_general_header" .}}
        <h2 style="color:#0E1A2B;font-size:21px;margin:0 0 12px">Confirm your email address</h2>
        <p>Hello,</p>
        <p>Follow <a href="{{ .URL }}" style="color:#1F4E8C;">this link</a> to confirm your email address.</p>
        <p>You will be logged in after successful confirmation.</p>
      {{template "email_general_footer" .}}

  auth_email_mfa_subject:
    type: text/plain
    meta:
      short: MFA login code subject
    template: "CulpOS: Your sign-in code"

  auth_email_mfa_content:
    type: text/html
    meta:
      short: MFA login code content
    template: |-
      {{template "email_general_header" .}}
        <h2 style="color:#0E1A2B;font-size:21px;margin:0 0 12px">Your login code</h2>
        <p>Hello,</p>
        <p>Enter this code on the CulpOS sign-in page: <code>{{.Code}}</code></p>
      {{template "email_general_footer" .}}

  auth_email_user_invite_subject:
    type: text/plain
    meta:
      short: User invite subject
    template: "You're invited to CulpOS"

  auth_email_user_invite_content:
    type: text/html
    meta:
      short: User invite content
    template: |-
      {{template "email_general_header" .}}
        <h2 style="color:#0E1A2B;font-size:21px;margin:0 0 12px">You’re invited to CulpOS</h2>
        <p>Hello,</p>
        <p>To get started, please follow <a href="{{ .URL }}" style="color:#1F4E8C;">this link</a> to accept the invitation and set your password.</p>
        <p>Once you accept the invitation, you can sign in to CulpOS.</p>
      {{template "email_general_footer" .}}
