templates:
  auth_email_password_reset_subject:
    type: text/plain
    meta:
      short: Password reset subject
    template: "CulpOS: Reset your password"

  auth_email_password_reset_content:
    type: text/html
    meta:
      short: Password reset content
    template: |-
      {{template "email_general_header" .}}
        <h1 style="font-size:21px;margin:0 0 12px;color:#0E1A2B;">Reset your password</h1>
          <p>Hello,</p>
          <p>We received a request to reset the password for your CulpOS account.</p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0;"><tr><td style="background:#1F4E8C;border-radius:8px;"><a href="{{ .URL }}" style="display:inline-block;padding:12px 20px;color:#FFFFFF;font-weight:700;text-decoration:none;">Reset Password</a></td></tr></table>
          <p style="font-size:13px;color:#5B6778;">If the button does not work, copy this link into your browser:<br><span style="word-break:break-all;">{{ .URL }}</span></p>
          <p>This link expires soon and can be used once. If you did not request a password reset, you can ignore this email — your password will not change.</p>
      {{template "email_general_footer" .}}

  auth_email_confirm_subject:
    type: text/plain
    meta:
      short: Email confirmation subject
    template: "CulpOS: Verify your email address"

  auth_email_confirm_content:
    type: text/html
    meta:
      short: Email confirmation content
    template: |-
      {{template "email_general_header" .}}
        <h1 style="font-size:21px;margin:0 0 12px;color:#0E1A2B;">Verify your email address</h1>
          <p>Hello,</p>
          <p>Please confirm that this is the email address for your CulpOS account.</p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0;"><tr><td style="background:#1F4E8C;border-radius:8px;"><a href="{{ .URL }}" style="display:inline-block;padding:12px 20px;color:#FFFFFF;font-weight:700;text-decoration:none;">Verify Email</a></td></tr></table>
          <p style="font-size:13px;color:#5B6778;">If the button does not work, copy this link into your browser:<br><span style="word-break:break-all;">{{ .URL }}</span></p>
          <p>If you did not create a CulpOS account, you can ignore this email.</p>
      {{template "email_general_footer" .}}

  auth_email_mfa_subject:
    type: text/plain
    meta:
      short: MFA login code subject
    template: "CulpOS: Your sign-in code"

  auth_email_mfa_content:
    type: text/html
    meta:
      short: MFA login code content
    template: |-
      {{template "email_general_header" .}}
        <h1 style="font-size:21px;margin:0 0 12px;color:#0E1A2B;">Your sign-in code</h1>
          <p>Hello,</p>
          <p>Enter this code on the CulpOS sign-in page to finish signing in:</p>
          <p style="font-size:28px;font-weight:800;letter-spacing:6px;margin:18px 0;color:#0E1A2B;">{{.Code}}</p>
          <p>If you did not try to sign in, change your password right away and contact your company administrator.</p>
      {{template "email_general_footer" .}}

  auth_email_user_invite_subject:
    type: text/plain
    meta:
      short: User invite subject
    template: "You're invited to CulpOS"

  auth_email_user_invite_content:
    type: text/html
    meta:
      short: User invite content
    template: |-
      {{template "email_general_header" .}}
        <h1 style="font-size:21px;margin:0 0 12px;color:#0E1A2B;">You’re invited to CulpOS</h1>
          <p>Hello,</p>
          <p>You have been invited to join your company’s workspace on CulpOS.</p>
          <table role="presentation" cellpadding="0" cellspacing="0" style="margin:22px 0;"><tr><td style="background:#1F4E8C;border-radius:8px;"><a href="{{ .URL }}" style="display:inline-block;padding:12px 20px;color:#FFFFFF;font-weight:700;text-decoration:none;">Accept Invitation</a></td></tr></table>
          <p style="font-size:13px;color:#5B6778;">If the button does not work, copy this link into your browser:<br><span style="word-break:break-all;">{{ .URL }}</span></p>
          <p>After accepting, set your password and sign in.</p>
      {{template "email_general_footer" .}}
