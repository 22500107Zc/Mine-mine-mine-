allow:
  # CulpOS: company users receive workspace access exclusively through their
  # company roles, scoped to their own workspace (see saas/integration).
  # The authenticated role must never be granted wildcard workspace access.
  authenticated:
    corteza::compose/:
      - namespaces.search

  admin:
    corteza::compose/:
      - grant
      - settings.read
      - settings.manage
      - namespace.create
      - namespaces.search

    corteza::compose:namespace/*:
      - read
      - update
      - delete
      - manage
      - export
      - modules.export
      - charts.export
      - pages.export
      - page.create
      - pages.search
      - module.create
      - modules.search
      - chart.create
      - charts.search

    corteza::compose:module/*/*:
      - read
      - update
      - delete
      - export
      - record.create
      - records.search

    corteza::compose:module-field/*/*/*:
      - record.value.read
      - record.value.update

    corteza::compose:record/*/*/*:
      - read
      - update
      - delete
      - revisions.search

    corteza::compose:chart/*/*:
      - read
      - update
      - delete
      - export

    corteza::compose:page/*/*:
      - read
      - update
      - delete
      - export

    corteza::compose:page-layout/*/*/*:
      - read
      - update
      - delete

  low-code-admin:
    corteza::compose/:
      - grant
      - settings.read
      - settings.manage
      - namespace.create
      - namespaces.search

    corteza::compose:namespace/*:
      - read
      - update
      - delete
      - manage
      - export
      - modules.export
      - charts.export
      - pages.export
      - page.create
      - pages.search
      - module.create
      - modules.search
      - chart.create
      - charts.search

    corteza::compose:module/*/*:
      - read
      - update
      - delete
      - export
      - record.create
      - records.search

    corteza::compose:module-field/*/*/*:
      - record.value.read
      - record.value.update

    corteza::compose:record/*/*/*:
      - read
      - update
      - delete

    corteza::compose:chart/*/*:
      - read
      - update
      - delete
      - export

    corteza::compose:page/*/*:
      - read
      - update
      - delete
      - export
