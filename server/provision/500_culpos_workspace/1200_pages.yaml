        - name: Subject
        - name: Customer
        - name: Status
        - name: Priority
        - name: AssignedTo
        - name: DueDate
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        showTotalCount: true
        emptyTitle: No cases yet.
        emptyDescription: Open a case to track a customer request or issue until it
          is resolved.
    pages:
      CaseRecord:
        handle: CaseRecord
        module: Case
        title: Case
        blocks:
        - title: Case
