        - name: LastName
        - name: Customer
        - name: JobTitle
        - name: Email
        - name: Phone
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        showTotalCount: true
        emptyTitle: No contacts yet.
        emptyDescription: Add the people you work with at your customers.
    pages:
      ContactRecord:
        handle: ContactRecord
        module: Contact
        title: Contact
        blocks:
        - title: Contact
