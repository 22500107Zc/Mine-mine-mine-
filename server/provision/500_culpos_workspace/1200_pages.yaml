# CulpOS workspace navigation
namespace: culpos-workspace-template
pages:
  Dashboard:
    handle: Dashboard
    title: Dashboard
    weight: 1
    visible: true
    blocks:
    - title: Welcome
      kind: Content
      xywh:
      - 0
      - 0
      - 12
      - 5
      options:
        body: <p>Welcome to <strong>CulpOS</strong> — your company’s operations in
          one system. Use the navigation to manage customers, contacts, records, cases,
          tasks, approvals and documents.</p>
    - title: Open Tasks
      kind: RecordList
      xywh:
      - 0
      - 4
      - 6
      - 9
      options:
        module: Task
        fields:
        - name: Title
        - name: Status
        - name: Priority
        - name: AssignedTo
        - name: DueDate
        presort: DueDate ASC
        perPage: 8
        allowExport: true
        showTotalCount: true
        prefilter: Status != 'Done'
        hideImportButton: true
        emptyTitle: No open tasks.
        emptyDescription: Tasks assigned to your team appear here.
    - title: Open Cases
      kind: RecordList
      xywh:
      - 6
      - 4
      - 6
      - 9
      options:
        module: Case
        fields:
        - name: Subject
        - name: Customer
        - name: Status
        - name: Priority
        - name: AssignedTo
        presort: createdAt DESC
        perPage: 8
        allowExport: true
        showTotalCount: true
        prefilter: Status != 'Resolved' AND Status != 'Closed'
        hideImportButton: true
        emptyTitle: No open cases.
        emptyDescription: Cases that need attention appear here.
    - title: Pending Approvals
      kind: RecordList
      xywh:
      - 0
      - 13
      - 6
      - 9
      options:
        module: Approval
        fields:
        - name: Subject
        - name: Type
        - name: RequestedBy
        - name: Approver
        - name: DueDate
        presort: DueDate ASC
        perPage: 8
        allowExport: true
        showTotalCount: true
        prefilter: Status = 'Pending'
        hideImportButton: true
        emptyTitle: No pending approvals.
        emptyDescription: Approval requests waiting for a decision appear here.
    - title: Upcoming Work
      kind: RecordList
      xywh:
      - 6
      - 13
      - 6
      - 9
      options:
        module: Task
        fields:
        - name: Title
        - name: AssignedTo
        - name: DueDate
        - name: Status
        presort: DueDate ASC
        perPage: 8
        allowExport: true
        showTotalCount: true
        prefilter: Status != 'Done' AND DueDate IS NOT NULL
        hideImportButton: true
        emptyTitle: Nothing scheduled.
        emptyDescription: Tasks with due dates appear here.
    - title: Recent Records
      kind: RecordList
      xywh:
      - 0
      - 22
      - 6
      - 9
      options:
        module: OperationsRecord
        fields:
        - name: Title
        - name: Category
        - name: Status
        - name: Owner
        presort: createdAt DESC
        perPage: 8
        allowExport: true
        showTotalCount: true
        hideImportButton: true
        emptyTitle: No records yet.
        emptyDescription: Recently added records appear here.
    - title: Recent Documents
      kind: RecordList
      xywh:
      - 6
      - 22
      - 6
      - 9
      options:
        module: Document
        fields:
        - name: Title
        - name: Category
        - name: Customer
        - name: Owner
        presort: createdAt DESC
        perPage: 8
        allowExport: true
        showTotalCount: true
        hideImportButton: true
        emptyTitle: No documents yet.
        emptyDescription: Recently added documents appear here.
    - title: Recent Changes — Customers
      kind: RecordList
      xywh:
      - 0
      - 31
      - 6
      - 9
      options:
        module: Customer
        fields:
        - name: Name
        - name: Status
        - name: AccountOwner
        - name: updatedAt
        presort: updatedAt DESC
        perPage: 8
        allowExport: true
        showTotalCount: true
        hideImportButton: true
        emptyTitle: No customers yet.
        emptyDescription: Add your first customer from Customers.
    - title: Cases by Status
      kind: Chart
      xywh:
      - 6
      - 31
      - 6
      - 9
      options:
        chart: CasesByStatus
  Customers:
    handle: Customers
    title: Customers
    weight: 2
    visible: true
    blocks:
    - title: Customers
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
      options:
        module: Customer
        fields:
        - name: Name
        - name: Status
        - name: Industry
        - name: Email
        - name: Phone
        - name: AccountOwner
        presort: createdAt DESC
        perPage: 20
        allowExport: true
        showTotalCount: true
        emptyTitle: No customers yet.
        emptyDescription: Add your first customer to start building your company workspace.
    pages:
      CustomerRecord:
        handle: CustomerRecord
        module: Customer
        title: Customer
        blocks:
        - title: Customer
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 16
          options:
            fields:
            - name: Name
            - name: Status
            - name: Industry
            - name: Email
            - name: Phone
            - name: Website
            - name: Address
            - name: AccountOwner
            - name: Notes
  Contacts:
    handle: Contacts
    title: Contacts
    weight: 3
    visible: true
    blocks:
    - title: Contacts
      kind: RecordList
      xywh:
      - 0
      - 0
      - 12
      - 18
