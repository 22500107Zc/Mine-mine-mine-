        perPage: 20
        allowExport: true
        showTotalCount: true
        emptyTitle: No tasks yet.
        emptyDescription: Create a task and assign it to keep work moving.
    pages:
      TaskRecord:
        handle: TaskRecord
        module: Task
        title: Task
        blocks:
        - title: Task
