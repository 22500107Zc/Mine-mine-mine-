        perPage: 20
        allowExport: true
        showTotalCount: true
        emptyTitle: No records yet.
        emptyDescription: Track operational records such as compliance items, facilities
          and finance entries.
    pages:
      OperationsRecordRecord:
        handle: OperationsRecordRecord
        module: OperationsRecord
        title: Record
        blocks:
        - title: Record
          kind: Record
          xywh:
          - 0
          - 0
          - 12
          - 16
          options:
            fields:
            - name: Title
            - name: Category
            - name: Status
            - name: Customer
            - name: Owner
            - name: Department
            - name: Date
            - name: Details
  Cases:
    handle: Cases
