# St.Cloud~OS workspace reports
namespace: culpos-workspace-template
charts:
  CasesByStatus:
    name: Cases by Status
    config:
      reports:
      - dimensions:
        - field: Status
          modifier: (no grouping / buckets)
        filter: ''
        metrics:
        - backgroundColor: '#1F4E8C'
          field: count
          fixTooltips: true
          type: pie
          label: Count
        module: Case
        renderer: {}
      colorScheme: tableau.Tableau10
