{{define "founder-login"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0E1A2B">
<link rel="icon" href="/culpos/static/favicon.ico" sizes="any">
<link rel="icon" href="/culpos/static/culpos-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="/culpos/static/culpos.css">
<title>{{brand.PageTitle .Title}}</title>
</head>
<body class="founder-access">
<main id="main">
  <section class="card founder-access-card" aria-labelledby="fa-h">
    <div class="founder-access-brand"><img src="/culpos/static/culpos-mark.svg" alt="" width="40" height="40"><span>{{brand.ProductName}}</span></div>
    <h1 id="fa-h">Founder Access</h1>
    {{if .Error}}<div class="alert error" role="alert">{{.Error}}</div>{{end}}
    <form method="post" action="/founder">
      <input type="hidden" name="csrf" value="{{.CSRF}}">
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" name="password" required maxlength="256" autocomplete="current-password" autofocus>
      </div>
      <button class="btn block lg" type="submit">Sign In</button>
    </form>
  </section>
</main>
</body>
</html>{{end}}
